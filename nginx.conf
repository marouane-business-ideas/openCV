# user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    keepalive_timeout  65;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name onlineresume.dev www.onlineresume.dev;  # Your domain name

        location / {
            return 301 https://$host$request_uri;  # Redirect all HTTP traffic to HTTPS
        }
    }

    # Block direct IP access
    server {
        listen 443 ssl;
        server_name 89.168.63.99;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/www.onlineresume.dev/fullchain.pem;  # Change to your domain name
        ssl_certificate_key /etc/letsencrypt/live/www.onlineresume.dev/privkey.pem;  # Change to your domain name
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    
        return 444;  # Drop the connection
    }


    # HTTPS server
    server {
        listen 443 ssl;
        server_name onlineresume.dev www.onlineresume.dev;  # Your domain name

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/www.onlineresume.dev/fullchain.pem;  # Change to your domain name
        ssl_certificate_key /etc/letsencrypt/live/www.onlineresume.dev/privkey.pem;  # Change to your domain name
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

        location / {
            proxy_pass http://localhost:4173;  # Frontend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://localhost:1337;  # Backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
