# user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    keepalive_timeout  65;

    # Language of the home page for visitors who open "/": the one they picked in the app ("lang" cookie, see
    # frontend/src/i18n.ts), else the first language of their browser
    map $http_accept_language $browser_language {
        default en;
        ~*^fr   fr;
    }
    map $cookie_lang $home_language {
        en      en;
        fr      fr;
        default $browser_language;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name onlineresume.dev www.onlineresume.dev;  # Your domain name

        location / {
            return 301 https://$host$request_uri;  # Redirect all HTTP traffic to HTTPS
        }
    }

    # Block direct IP access
    server {
        listen 443 ssl;
        server_name 54.39.230.66;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/www.onlineresume.dev/fullchain.pem;  # Change to your domain name
        ssl_certificate_key /etc/letsencrypt/live/www.onlineresume.dev/privkey.pem;  # Change to your domain name
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";
    
        return 444;  # Drop the connection
    }


    # HTTPS server
    server {
        listen 443 ssl;
        server_name onlineresume.dev www.onlineresume.dev;  # Your domain name

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/www.onlineresume.dev/fullchain.pem;  # Change to your domain name
        ssl_certificate_key /etc/letsencrypt/live/www.onlineresume.dev/privkey.pem;  # Change to your domain name
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

        # Frontend: the files written by its build (see the Dockerfile)
        root /app/frontend/build/client;

        # Home page: French users are sent to the French one before any page is sent, so they don't see English first
        location = / {
            if ($home_language = fr) {
                return 302 /fr$is_args$args;
            }
            # The response depends on these headers: caches must not serve one visitor's response to another
            add_header Vary "Accept-Language, Cookie";

            try_files /index.html =404;
        }

        # A file of the build, else the page's own HTML file if the build wrote one (pre-rendered pages, like /fr), else
        # the app without content, which renders the page matching the URL in the browser
        location / {
            try_files $uri $uri/index.html /__spa-fallback.html;
        }

        # Scripts, styles, fonts and images of the build: a missing one is an error, not a page
        location /assets/ {
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://localhost:1337;  # Backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
