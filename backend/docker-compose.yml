services:
  app:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: resume_app
    volumes:
      - .:/app
      - ./database:/app/backend/database
    ports:
      - "1337:1337"  # Expose the port for Nginx
    networks:
      - app_network

  browserless:
    image: ghcr.io/browserless/chromium
    container_name: browserless
    environment:
      - CONCURRENT=10
    ports:
      - "3000:3000"  # Expose Playwright service on port 3000
    networks:
      - app_network

networks:
  app_network:
    driver: bridge  # Use the default bridge network
