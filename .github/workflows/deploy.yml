# .github/workflows/deploy.yml
name: Deploy OnlineResume to Oracle VPS

on:
  push:
    branches:
      - main

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    # Nothing is deployed when a test fails
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 -t onlineresume:latest .

      - name: Save and transfer Docker image to VPS
        run: |
          docker save onlineresume:latest | gzip | ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.VPS_HOST }} '
            sudo docker stop $(sudo docker ps -q) || true
            sudo docker rm $(sudo docker ps -a -q) || true
            sudo docker image rm onlineresume:latest --force || true
            gunzip | sudo docker load
          '

      - name: Remove local Docker image
        run: docker image rm onlineresume:latest

      - name: Run Docker container on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.VPS_HOST }} '
            # --dns: the host resolver (169.254.169.254) is unreachable from inside containers on this Oracle VPS
            sudo docker run -d --name onlineresume \
              --restart unless-stopped \
              --dns 8.8.8.8 --dns 1.1.1.1 \
              -p 80:80 -p 443:443 \
              -v ./database:/app/backend/database \
              -v ./httpsEncryption:/etc/letsencrypt \
              onlineresume:latest
          '
