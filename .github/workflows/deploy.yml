# .github/workflows/deploy.yml
name: Deploy OnlineResume to OVH VPS

on:
  push:
    branches:
      - main

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets:
      CLERK_DEVELOPMENT_SECRET_KEY: ${{ secrets.CLERK_DEVELOPMENT_SECRET_KEY }}
      STRIPE_DEVELOPMENT_SECRET_KEY: ${{ secrets.STRIPE_DEVELOPMENT_SECRET_KEY }}

  deploy:
    # Nothing is deployed when a test fails
    needs: tests
    runs-on: ubuntu-latest
    # Two deploys at once would replace the container at the same time: the second one waits
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # The backend's secrets come from the repository's GitHub secrets (Settings > Secrets and variables > Actions):
      # they are never in the repository nor in the image. The container reads them from the VPS (see below)
      - name: Write the backend's secrets on VPS
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SIGNING_SECRET: ${{ secrets.STRIPE_WEBHOOK_SIGNING_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          names="STRIPE_SECRET_KEY STRIPE_WEBHOOK_SIGNING_SECRET CLERK_SECRET_KEY CLERK_WEBHOOK_SECRET GMAIL_APP_PASSWORD"
          # Stop before touching the running app: the backend wouldn't start without them
          for name in $names; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The GitHub secret $name is missing (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done
          for name in $names; do
            printf '%s="%s"\n' "$name" "$(printenv "$name")"
          done | ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.VPS_HOST }} 'umask 077 && cat > backend.env.production.local'

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 -t onlineresume:latest .

      # The site keeps running meanwhile (about 2 minutes): the loaded image takes the name onlineresume:latest, the
      # running container keeps the image it started from
      - name: Send the Docker image to the VPS
        run: |
          docker save onlineresume:latest | gzip | ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.VPS_HOST }} 'gunzip | sudo docker load'

      - name: Remove local Docker image
        run: docker image rm onlineresume:latest

      # The site is down only now, for a few seconds
      - name: Replace the running container on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.VPS_HOST }} 'bash -s' < ops/deploy/replace-container.sh
