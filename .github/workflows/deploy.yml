# .github/workflows/deploy.yml
name: Deploy OnlineResume to OVH VPS

on:
  push:
    branches:
      - main

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    secrets:
      CLERK_DEVELOPMENT_SECRET_KEY: ${{ secrets.CLERK_DEVELOPMENT_SECRET_KEY }}

  deploy:
    # Nothing is deployed when a test fails
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # The backend's secrets come from the repository's GitHub secrets (Settings > Secrets and variables > Actions):
      # they are never in the repository nor in the image. The container reads them from the VPS (see below)
      - name: Write the backend's secrets on VPS
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SIGNING_SECRET: ${{ secrets.STRIPE_WEBHOOK_SIGNING_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          names="STRIPE_SECRET_KEY STRIPE_WEBHOOK_SIGNING_SECRET CLERK_SECRET_KEY CLERK_WEBHOOK_SECRET GMAIL_APP_PASSWORD"
          # Stop before touching the running app: the backend wouldn't start without them
          for name in $names; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The GitHub secret $name is missing (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done
          for name in $names; do
            printf '%s="%s"\n' "$name" "$(printenv "$name")"
          done | ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.VPS_HOST }} 'umask 077 && cat > backend.env.production.local'

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 -t onlineresume:latest .

      - name: Save and transfer Docker image to VPS
        run: |
          docker save onlineresume:latest | gzip | ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.VPS_HOST }} '
            sudo docker stop $(sudo docker ps -q) || true
            sudo docker rm $(sudo docker ps -a -q) || true
            sudo docker image rm onlineresume:latest --force || true
            gunzip | sudo docker load
          '

      - name: Remove local Docker image
        run: docker image rm onlineresume:latest

      - name: Run Docker container on VPS
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.VPS_HOST }} '
            # --dns: don't depend on the host's resolver, which some VPS hosts make unreachable from inside containers
            sudo docker run -d --name onlineresume \
              --restart unless-stopped \
              --dns 8.8.8.8 --dns 1.1.1.1 \
              -p 80:80 -p 443:443 \
              -v ./database:/app/backend/database \
              -v ./httpsEncryption:/etc/letsencrypt \
              -v ./backend.env.production.local:/app/backend/.env.production.local:ro \
              onlineresume:latest
          '
