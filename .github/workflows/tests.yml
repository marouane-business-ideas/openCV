# Runs on every pull request, and before every deploy (see deploy.yml)
name: Tests

on:
  pull_request:
  workflow_call:
    secrets:
      # For the end-to-end tests (see below)
      CLERK_DEVELOPMENT_SECRET_KEY:
        required: true
      STRIPE_DEVELOPMENT_SECRET_KEY:
        required: true

jobs:
  build:
    name: Type-check, build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The deployed app is built the same way when its container starts: a build that fails here would fail there
      - run: npm run build
      - run: npx vitest run

  backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # These tests don't print PDFs: no need for Puppeteer's browser
      - run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      - run: npm test

  templates:
    name: Template tests
    runs-on: ubuntu-latest
    # The image the screenshots were made with (see frontend/tests/templates/run-in-docker.sh)
    container:
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The image's own Node is the one Playwright shipped it with: the PDFs are printed with the project's
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      # Puppeteer, which prints the PDFs
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: template-tests-report
          path: frontend/playwright-report
          retention-days: 14

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      # The image's own Node is the one Playwright shipped it with: the app runs on the project's
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      # The backend creates its database there
      - run: mkdir -p backend/database
      # Both in this job, which merging requires (the repository's rules name it): some bugs only exist in one.
      # The secrets of the development settings the app uses here, only given to these steps. CLERK_SECRET_KEY: for the
      # backend and the tests that sign in (e2e/helpers/clerk.ts). STRIPE_SECRET_KEY (test mode): for the backend, which
      # looks up a user's subscription to rebuild their missing row (ensureUser in db.js), as the CI's database is empty
      - name: Against the dev server
        run: npx playwright test
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEVELOPMENT_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_DEVELOPMENT_SECRET_KEY }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/dev
      - name: Against the production build
        # Even when the dev server's failed
        if: ${{ !cancelled() }}
        run: npx playwright test
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_DEVELOPMENT_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_DEVELOPMENT_SECRET_KEY }}
          E2E_APP: build
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-tests-report
          path: playwright-report
          retention-days: 14
